# Public-facing address shown to players in the drawing link.
host: localhost

# Port the drawing web server listens on. Must be reachable from the browser.
port: 8080

# Optional: full public base URL for the web editor, used verbatim in drawing
# links instead of "http://<host>:<port>". Set this when the editor is reached
# through an HTTPS reverse proxy or tunnel (e.g. https://map.example.com),
# where the public scheme/host/port differ from what the plugin binds. Leave
# empty to fall back to http://<host>:<port>. A scheme is assumed: if you write
# just "map.example.com", "https://" is added automatically.
web-url: ""

# How long a drawing session link stays valid, in seconds.
# Default is 14 days (1209600).
token-ttl-seconds: 1209600

# Show the large ASCII "MapArtist" banner in the console on startup.
show-ascii-banner: true

# Maximum number of drawing session links a player can generate per minute.
# 0 or a negative value disables the limit.
rate-limit-per-minute: 30

# When true, the web editor only accepts a submit while the player still holds
# the map in their hand (main or off). Prevents "I have the link, so I can
# write to the map" wireless communication stuff. Set false to allow submits any time the
# session link is valid if you don't have that issue.
require-holding-to-submit: true

# Maximum size of an image upload (base64 / PNG pasted into the editor), in
# megabytes. Not too required, but moreso a safety measure type of thing.
max-upload-size-megabytes: 10

# whether the map item itself is protected from destruction: fire, lava, cactus, explosions,
# and other item-deleting blocks. Sort of how netherite survives lava, but for
# MapArtist maps. Applies while the map is a dropped item entity.
map-protection-itemdestruction: true

# Prevent players from breaking item frames that hold LOCKED MapArtist maps by
# damaging them. The map's owner (and admins) can still break their own locked
# map out of the frame. NOTE: this only protects the item frame itself; the
# block behind the frame is not affected in any way.
map-protection-anti-break-when-locked: false

# Write a readable log of every drawing edit. Each line records the player, the
# UTC timestamp, and the map ID(s) edited (multi-map walls are logged in a
# single entry listing every map ID touched).
log-edits: true

# Maximum number of lines kept in the edit log. -1 is unlimited.
# (logs are pretty small).
# any other non-negative number keeps the newest entries and deletes the
# oldest ones to fit.
log-entry-limit: -1

# How long autosaved drafts are kept on disk before being swept, in days.
draft-retention-days: 21

# Hide the item frame border when a custom MapArtist map is placed in it.
# The frame becomes visible again when the map is swapped out or broken out.
invisible-item-frames: true

# Disable cartography tables. The plugin replaces map making, and vanilla map
# locking/expansion could break drawing maps.
disable-cartography-table: true

# Enable the multi-map wall feature: sneak-right-clicking an item frame in a
# grid of drawing maps reports the detected grid dimensions in chat.
multi-map-drawing: true

# Largest grid dimension allowed for the multi-map wall feature, in item frames.
multi-map-max-grid: 5

# For WALL (multi-map) editing sessions: how far (in blocks) the player must be
# from the center of the wall they're editing in order to submit changes. This
# replaces the "must be holding the map" check for wall sessions, since you may
# not be carrying any individual map. Set to 0 or negative to disable.
wall-proximity-blocks: 10

# When true, maps keep their vanilla behaviour until they are first opened
# with the paintbrush (which converts them to drawing maps). This also applies
# to map walls. When false, newly created maps become MapArtist drawing maps
# immediately.
vanilla-mapping: true

# Paintbrush item used to open map drawing sessions (off-hand) and to interact
# with map walls (either hand). Customize these if your resource pack uses a
# different model, or to avoid clashing with other plugins that use the same
# base item + item model.
paintbrush:
  # Base item the brush is made from.
  base-item: STICK
  # Display name. Supports & color codes.
  name: "&6&lPaintbrush"
  # item_model component assigned to the brush (namespace:path).
  item-model: "minecraft:brush"
